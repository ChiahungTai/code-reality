# License audit: this repo is MIT with a no-copyleft dependency chain
# (rust-analyzer SCIP indexes are consumed as data, not linked).
[advisories]
ignore = [
    # `paste` unmaintained (informational): transitive via
    # single-clustering -> nalgebra-sparse -> nalgebra -> simba; no
    # vulnerability, no upstream replacement route — re-evaluate on
    # single-clustering updates.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # ruff_python_parser transitive: permissive, LLVM exception grants
    # patent rights; Unicode-DFS-2016 is the older Unicode license
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
]
