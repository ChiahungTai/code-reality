# PyPI wheel release matrix (EP: ep-pypi-wheel-distribution S2).
#
# Scope: macOS arm64 ONLY (user adjudication 2026-08-28 — verify/ship
# what this machine's users run; the full platform matrix stays below,
# commented, for when Linux consumers exist).
#
# Two faces:
#   - workflow_dispatch = dry-run: build 3 wheels (macOS arm64 x 3
#     crates), upload as artifacts, publish NOTHING.
#   - push tag v* = same build + one publish job per dist, each bound
#     to its own PyPI trusted-publisher environment (PyPI allows one
#     project per (repo, workflow, environment) tuple — hit live
#     2026-08-28, hence the three environments).

name: release-wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-wheels-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned to the version the local spike validated (zero-config bin
  # bindings, py3-none-<platform> tags, metadata from pyproject.toml).
  MATURIN_VERSION: "1.15.0"

jobs:
  build-wheels:
    name: wheels (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          # --- deferred full matrix (re-enable per platform as consumers
          # --- appear; the first in-flight dry-run run 33182529285 tested
          # --- these legs for free and its outcome is recorded in the EP):
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   cross: true  # Apple toolchain cross; rustup target only
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-gnu
          #   cross: false
          # - os: ubuntu-24.04-arm  # free native arm64 runner, public repos
          #   target: aarch64-unknown-linux-gnu
          #   cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain and target (rust-toolchain.toml)
        # rustup show activates/installs the toolchain pinned by
        # rust-toolchain.toml (1.96.0); target add must land on THAT
        # toolchain, not the runner's preinstalled stable (EP review I3).
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      # cache off: uv here installs ONE pinned tool (maturin) — the
      # default cache keys on uv.lock, which this Rust repo never has,
      # so it would never invalidate (the CI warning this silences)
      - uses: astral-sh/setup-uv@v6
        with:
          cache: false

      - name: Install maturin
        run: uv tool install maturin==${{ env.MATURIN_VERSION }}

      - name: Build all three crate wheels
        run: |
          for c in code-reality code-reality-lsp-bridge pyrefly-producer; do
            maturin build --release --target ${{ matrix.target }} -m "crates/$c/Cargo.toml"
          done

      - name: List built wheels
        run: ls -lh target/wheels/

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels/*.whl
          if-no-files-found: error

  # Per-dist publish jobs (EP S3): each downloads the merged wheels,
  # selects ONLY its own dist's files (glob disjointness:
  # code_reality- vs code_reality_lsp_bridge- vs pyrefly_producer-),
  # and uploads via OIDC trusted publishing. mv failing loud on a
  # missing file is deliberate (no || true here).
  publish-code-reality:
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: wheels
          merge-multiple: true
      - name: Select this dist's wheels
        run: mkdir dist && mv wheels/code_reality-*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-code-reality-lsp-bridge:
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release-lsp-bridge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: wheels
          merge-multiple: true
      - name: Select this dist's wheels
        run: mkdir dist && mv wheels/code_reality_lsp_bridge-*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-pyrefly-producer:
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release-pyrefly-producer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: wheels
          merge-multiple: true
      - name: Select this dist's wheels
        run: mkdir dist && mv wheels/pyrefly_producer-*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # npm embedded face (EP: ep-npm-embedded-face S2). The platform
  # package carries the five bins extracted verbatim from the wheels
  # built by this same run — identical bytes, identical embedded revs,
  # no separate build. Unlike PyPI (one project per (repo, workflow,
  # environment) tuple), npm needs a single environment for the single
  # package, authenticated by the NPM_TOKEN secret.
  npm-pack:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Any cargo works for the version guard (it reads manifests, no
      # build); the runner's preinstalled rust drifts, so pin the
      # toolchain explicitly.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v5
        with:
          name: wheels-aarch64-apple-darwin
          path: wheels
          merge-multiple: true
      - name: Version guard (npm package version must equal the workspace version)
        run: |
          ws=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages | map(select(.name == "code-reality")) | .[0].version')
          pj=$(jq -r .version npm/code-reality-darwin-arm64/package.json)
          [ "$ws" = "$pj" ] || { echo "version drift: workspace=$ws npm=$pj"; exit 1; }
      - name: Extract the five bins from the wheels
        # -j flattens <pkg>-<ver>.data/scripts/<bin> into bin/; the glob
        # cannot touch sboms (they live under .dist-info/sboms/) and the
        # five bin names are disjoint across the three wheels.
        run: |
          for whl in wheels/*.whl; do
            unzip -j -o "$whl" '*.data/scripts/*' -d npm/code-reality-darwin-arm64/bin/
          done
          chmod +x npm/code-reality-darwin-arm64/bin/*
      - name: Pack (dry-run list check, then real tarball)
        working-directory: npm/code-reality-darwin-arm64
        run: |
          npm pack --dry-run
          npm pack
      - uses: actions/upload-artifact@v5
        with:
          name: npm-tarball
          path: npm/code-reality-darwin-arm64/*.tgz
          if-no-files-found: error

  npm-publish:
    needs: npm-pack
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release-npm
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: npm-tarball
          path: tgz
      - uses: actions/setup-node@v5
        with:
          registry-url: 'https://registry.npmjs.org'
      # npm versions are publish-once: re-running this job for an
      # already-published version fails with E403 (deliberate loud fail;
      # the bootstrap 0.3.0 was published manually from the same-tag
      # PyPI wheels — the first automated npm release is the next tag).
      - run: npm publish tgz/code-reality-darwin-arm64-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
