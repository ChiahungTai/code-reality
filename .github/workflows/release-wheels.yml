# PyPI wheel release matrix (EP: ep-pypi-wheel-distribution S2).
#
# Two faces:
#   - workflow_dispatch = dry-run: build 12 wheels (4 platforms x 3 crates),
#     upload as artifacts, publish NOTHING. Use this to validate the matrix
#     (Linux build of the pyrefly engine git-dep is the kill-gate).
#   - push tag v* = same matrix + publish job (currently gated OFF; S3 wires
#     PyPI trusted publishing and flips the gate).
#
# This workflow is inert until the repo has a remote and is pushed.

name: release-wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-wheels-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned to the version the local spike validated (zero-config bin
  # bindings, py3-none-<platform> tags, metadata from pyproject.toml).
  MATURIN_VERSION: "1.15.0"

jobs:
  build-wheels:
    name: wheels (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true  # Apple toolchain cross; rustup target only
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-24.04-arm  # free native arm64 runner, public repos
            target: aarch64-unknown-linux-gnu
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain and target (rust-toolchain.toml)
        # rustup show activates/installs the toolchain pinned by
        # rust-toolchain.toml (1.96.0); target add must land on THAT
        # toolchain, not the runner's preinstalled stable (EP review I3).
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: astral-sh/setup-uv@v5

      - name: Install maturin
        run: uv tool install maturin==${{ env.MATURIN_VERSION }}

      - name: Build all three crate wheels
        run: |
          for c in code-reality code-reality-lsp-bridge pyrefly-producer; do
            maturin build --release --target ${{ matrix.target }} -m "crates/$c/Cargo.toml"
          done

      - name: List built wheels
        run: ls -lh target/wheels/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels/*.whl
          if-no-files-found: error

  # S3 wires this: create the three PyPI projects' trusted publishers
  # (OIDC bound to this repo + workflow + environment "release"), then
  # flip `if: false` to `if: startsWith(github.ref, 'refs/tags/')`.
  publish:
    needs: build-wheels
    if: false  # no-op until trusted publishing is configured (EP S3)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
      contents: write  # attach wheels to the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install maturin
        run: uv tool install maturin==${{ env.MATURIN_VERSION }}

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (trusted publishing)
        run: |
          for c in code-reality code-reality-lsp-bridge pyrefly-producer; do
            maturin publish --target x86_64-unknown-linux-gnu -m "crates/$c/Cargo.toml" || true
          done
          # NOTE: placeholder shape — S3 replaces the rebuild-publish loop
          # with twine-style upload of the downloaded dist/*.whl set (one
          # upload per project across platforms) once publishers exist.
