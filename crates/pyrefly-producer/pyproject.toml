[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyrefly-producer"
description = "Rust-native Python occurrence producer (Pyrefly engine link, SCIP face): pyrefly-index emits repo-keyed SCIP indexes, pyrefly-lsp hosts the engine as a stdio language server"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/ChiahungTai/code-reality"
