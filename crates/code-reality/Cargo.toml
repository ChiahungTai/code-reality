[package]
name = "code-reality"
version.workspace = true
edition.workspace = true
license = "MIT"

[dependencies]
single-clustering = { version = "0.7", default-features = false }
scip = { workspace = true }
protobuf = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
glob = { workspace = true }
ruff_python_parser = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_text_size = "0.0.10"
# JS/TS syntax-aware call-site classifier (S3): the POC-locked
# tree-sitter grammar set — regex-only classification is rejected (AD-8).
tree-sitter = "0.25"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
fancy-regex = { workspace = true }
rmcp = { workspace = true, features = ["transport-streamable-http-server", "transport-streamable-http-client-reqwest", "client"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
hyper-util = { workspace = true }
axum = { workspace = true }
schemars = { workspace = true }
cr-freshness = { path = "../cr-freshness" }

[dev-dependencies]
tempfile = { workspace = true }
scip = { workspace = true }
protobuf = { workspace = true }
