[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "code-reality"
description = "Meta-layer structural facts, governance audits, and narrative artifacts for AI coding sessions (Rust carrier): symbol truth queries, caller edges/closures, completeness audits, graph engine"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/ChiahungTai/code-reality"
