[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
scip = "0.9"
protobuf = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
toml = "0.9"
libc = "0.2"
regex = "1"
serde = "1"
glob = "0.3"
ruff_python_parser = "0.0.10"
ruff_python_ast = "0.0.10"
fancy-regex = "0.14"

[profile.release]
# Query tooling: prefer fast index decode (the 275MB NT index parses in ~0.7s in release).
debug = false
